<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi Mỹ Kim</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500;600&display=swap">
<style>
:root{--ink:#6b2d4a;--pink:#ff8fb1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:Quicksand,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f7ece4 0%,#f3e3dc 60%,#dfe6cf 100%);-webkit-tap-highlight-color:transparent}
.script{font-family:'Dancing Script',cursive,serif}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .8s}
.hidden{opacity:0;pointer-events:none}
h1{font-size:2.2rem;margin:0 0 6px}
#env{width:210px;cursor:pointer;animation:bob 2.4s ease-in-out infinite;background:none;border:0;padding:0;margin:18px 0}
@keyframes bob{0%,100%{transform:perspective(600px) rotateY(-16deg) rotateX(6deg)}50%{transform:perspective(600px) translateY(-12px) rotateY(16deg) rotateX(-4deg)}}#env{filter:drop-shadow(0 14px 10px rgba(90,40,40,.25))}
#garden{perspective:900px;touch-action:manipulation}
#garden .ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#cfdcb4,#aebf8e)}
#hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;font-size:1.05rem;pointer-events:none}
.flower{position:absolute;width:96px;height:144px;transform-origin:50% 100%;transform:translate(-50%,-27%) scale(0);animation:bloom .9s cubic-bezier(.3,1.6,.5,1) forwards;cursor:pointer;user-select:none}
@keyframes bloom{0%{transform:translate(-50%,-27%) scale(0) rotateY(90deg)}100%{transform:translate(-50%,-27%) scale(1) rotateY(0)}}.flower{filter:drop-shadow(0 8px 5px rgba(80,40,30,.22))}.flower svg{display:block;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}@keyframes sway{50%{transform:rotateZ(3deg) rotateY(18deg)}}
.fly{position:absolute;animation:fly 9s linear infinite;pointer-events:none}.fly svg{display:block;animation:flap .35s ease-in-out infinite alternate}@keyframes flap{to{transform:scaleX(.55)}}
@keyframes fly{0%{transform:translate(-10vw,0)}25%{transform:translate(25vw,-40px)}50%{transform:translate(55vw,20px)}75%{transform:translate(80vw,-30px)}100%{transform:translate(110vw,0)}}
.petal{position:fixed;top:-30px;width:12px;height:16px;border-radius:80% 0 80% 0;opacity:.85;animation:fall linear forwards;pointer-events:none;z-index:5}
@keyframes fall{from{transform:perspective(300px) translate(0,0) rotateX(0) rotate(0)}to{transform:perspective(300px) translate(40px,110vh) rotateX(720deg) rotate(300deg)}}
#modal{perspective:900px;position:fixed;inset:0;background:rgba(80,20,50,.45);display:flex;align-items:center;justify-content:center;z-index:10;transition:opacity .4s}
.polaroid{background:#fff;padding:12px 12px 18px;width:min(82vw,330px);border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:transform .12s;transform:rotate(-2deg);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:rotateY(100deg) scale(.5);opacity:0}}
.polaroid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px;display:block}
.polaroid p{margin:12px 6px 6px;font-size:1.05rem;line-height:1.35}
.polaroid small{opacity:.6}
#fin{z-index:8;background:radial-gradient(circle at 50% 30%,#fff8ee,#f4d9d4 75%);overflow-y:auto;justify-content:flex-start;padding-top:12vh}
#msg{font-size:1.35rem;line-height:1.6;max-width:480px;min-height:12em;white-space:pre-line}
#q{margin-top:18px;transition:opacity 1s}
.btn{font:inherit;font-weight:600;border:0;border-radius:99px;padding:12px 28px;margin:6px;font-size:1.05rem;cursor:pointer;background:var(--pink);color:#fff;box-shadow:0 6px 16px rgba(255,100,150,.4)}
.btn.no{background:#c9b3bf;position:relative;transition:transform .15s}
#thx{font-size:2rem}
</style></head>
<body>
<div id="intro" class="screen">
  <div class="script" style="font-size:1.6rem">Gửi Mỹ Kim</div>
  <button id="env" aria-label="Mở thư"><svg viewBox="0 0 200 140" width="210"><rect x="6" y="14" width="188" height="120" rx="8" fill="#fbf5ec" stroke="#d8c3b0" stroke-width="2"/><path d="M6 20 L100 84 L194 20" fill="none" stroke="#d8c3b0" stroke-width="2"/><path d="M6 130 L84 72 M194 130 L116 72" stroke="#e6d6c6" stroke-width="2"/><circle cx="100" cy="84" r="14" fill="#c9566f"/><path d="M100 91 C90 84 93 76 100 80 C107 76 110 84 100 91Z" fill="#f7d7de"/></svg></button>
  <div>Chạm vào phong bì nhé</div>
</div>

<div id="garden" class="screen hidden" style="padding:0;justify-content:flex-start">
  <div class="ground"></div>
  <div id="hint" class="script" style="font-size:1.6rem"></div>
</div>

<div id="modal" class="hidden"><div class="polaroid"><img id="pimg" alt=""><p id="pcap"></p><small>chạm để đóng</small></div></div>

<div id="fin" class="screen hidden">
  <h1 class="script">Chúc mừng 20/10</h1>
  <div id="msg"></div>
  <div id="q" class="hidden">
    <div style="font-size:1.25rem;margin-bottom:8px">Em có biết em tuyệt vời cỡ nào không?</div>
    <button class="btn" id="yes">Có</button><button class="btn no" id="no">Không</button><div id="qh" style="min-height:1.5em;margin-top:14px;font-size:.95rem"></div>
  </div>
  <div id="thx" class="script hidden">Anh biết em biết mà.<br>Yêu em nhiều.</div>
</div>

var CAP=["Hôm đó em cười tươi thiệt.","Ăn mì mà còn bày trò.","Có bằng khen mà làm mặt như vầy.","Hai đứa mình.","Nắng vậy mà vẫn tạo dáng được."];
function fl(x,y,col){return '<g fill="'+col+'">'+[[0,-3.4],[3.4,0],[0,3.4],[-3.4,0]].map(function(o){return '<circle cx="'+(x+o[0])+'" cy="'+(y+o[1])+'" r="4.2"/>'}).join('')+'</g><circle cx="'+x+'" cy="'+y+'" r="1.3" fill="#fff6c8"/>'}
var BF='<svg viewBox="0 0 30 24" width="28"><g fill="#d7a6c4" opacity=".85"><ellipse cx="9" cy="8" rx="8" ry="6"/><ellipse cx="21" cy="8" rx="8" ry="6"/><ellipse cx="10" cy="17" rx="5" ry="4"/><ellipse cx="20" cy="17" rx="5" ry="4"/></g><rect x="14" y="4" width="2" height="15" rx="1" fill="#6b2d4a"/></svg>';
function flower(i){var C=[['#ee86a9','#f7b9cf'],['#b4a0e0','#d8cbf2'],['#fffaf0','#f2c14e'],['#e8837a','#f3a79e'],['#e6a0c8','#f4c9e0']][i],k;
var s='<svg viewBox="0 0 100 150" width="96" height="144"><path d="M50 62 C48 95 52 120 50 150" stroke="#6f8f5a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M50 115 C30 108 22 96 20 88 C38 90 48 100 50 115Z" fill="#86a56d"/><path d="M50 128 C68 122 78 110 80 102 C62 104 52 114 50 128Z" fill="#7a9a62"/>';
if(i<2){for(k=0;k<16;k++){var a=k*2.4,r=5+Math.sqrt(k)*6.2;s+=fl(50+r*Math.cos(a),40+r*Math.sin(a)*.85,C[k%2])}}
else if(i==2){for(k=0;k<12;k++)s+='<ellipse cx="50" cy="22" rx="5" ry="15" transform="rotate('+k*30+' 50 40)" fill="'+C[0]+'" stroke="#e8dcc6" stroke-width=".6"/>';s+='<circle cx="50" cy="40" r="8" fill="'+C[1]+'"/>'}
else if(i==3){s+='<path d="M30 40 C28 18 40 10 50 22 C60 10 72 18 70 40 C68 58 32 58 30 40Z" fill="'+C[0]+'"/><path d="M50 22 C42 30 42 50 50 56 C58 50 58 30 50 22Z" fill="'+C[1]+'"/>'}
else{for(k=0;k<8;k++)s+='<ellipse cx="50" cy="24" rx="9" ry="17" transform="rotate('+k*45+' 50 40)" fill="'+C[0]+'" opacity=".9"/>';s+='<circle cx="50" cy="40" r="6" fill="#f2c14e"/>'}
return s+'</svg>'}
var $=function(i){return document.getElementById(i)};
var n=0,modalOpen=false;
function petals(k){for(var i=0;i<k;i++){var p=document.createElement('div');p.className='petal';p.style.background=['#f2b4c4','#f7d0da','#e9a3b8','#fff1f3'][i%4];p.style.left=Math.random()*100+'vw';p.style.animationDuration=(5+Math.random()*5)+'s';p.style.animationDelay=Math.random()*3+'s';document.body.appendChild(p);setTimeout(function(q){q.remove()},12000,p)}}
function setHint(){$('hint').textContent=n<5?'Chạm vào vườn để gieo hoa ('+n+'/5)':''}
$('env').onclick=function(){this.style.animation='none';this.style.transition='all .9s';this.style.opacity='0';this.style.transform='scale(1.3) translateY(-30px)';petals(14);setTimeout(function(){$('intro').classList.add('hidden');$('garden').classList.remove('hidden');setHint();
 for(var i=0;i<3;i++){var b=document.createElement('div');b.className='fly';b.innerHTML=BF;b.style.top=(15+i*18)+'%';b.style.animationDelay=(-i*3)+'s';$('garden').appendChild(b)}},1100)};
function open(i){modalOpen=true;$('pimg').src=PH[i];$('pcap').textContent=CAP[i];P.style.animation='none';P.offsetWidth;P.style.animation='';P.style.transform='';$('modal').classList.remove('hidden')}
$('modal').onclick=function(){$('modal').classList.add('hidden');modalOpen=false;if(n===5&&!window.done){window.done=1;setTimeout(finale,700)}};
var P=document.querySelector('.polaroid');
function tilt(x,y){var r=P.getBoundingClientRect(),dx=(x-r.left-r.width/2)/r.width,dy=(y-r.top-r.height/2)/r.height;P.style.animation='none';P.style.transform='rotate(-2deg) rotateY('+dx*28+'deg) rotateX('+(-dy*28)+'deg)'}
$('modal').addEventListener('mousemove',function(e){tilt(e.clientX,e.clientY)});
$('modal').addEventListener('touchmove',function(e){tilt(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
$('garden').addEventListener('click',function(e){
 if(modalOpen||n>=5||e.target.classList.contains('flower'))return;
 var i=n++,f=document.createElement('div');f.className='flower';f.innerHTML=flower(i);
 f.style.left=e.clientX+'px';f.style.top=Math.max(e.clientY,110)+'px';
 f.onclick=function(){if(!modalOpen)open(i)};
 $('garden').appendChild(f);setHint();petals(5);setTimeout(function(){open(i)},800)});
var TXT="Gửi Mỹ Kim,\n\nAnh mong em thành công trong mọi điều em muốn làm, và đừng lo nghĩ nhiều quá.\nEm vốn mạnh mẽ rồi, mà mạnh đến đâu thì vẫn có anh ở đây.\n\nCảm ơn em đã đến bên anh từ 30/4.";
function finale(){$('garden').classList.add('hidden');$('fin').classList.remove('hidden');petals(40);setInterval(function(){petals(4)},2500);
 var i=0;(function t(){$('msg').textContent=TXT.slice(0,++i);if(i<TXT.length)setTimeout(t,45);else{$('q').classList.remove('hidden')}})()}
var tries=0,LB=["Không","Chắc chưa?","Nghĩ lại đi","Thật à?","Thôi mà"],QH=["","Bấm nhầm đúng không?","Em suy nghĩ lại đi","Nút này hơi trơn nha","Còn một cơ hội cuối","Hết đường lùi rồi nha"];
function dodge(e){if(e&&e.preventDefault)e.preventDefault();tries++;var b=$('no'),y=$('yes');y.style.transition='transform .3s';
 if(tries>=5){b.style.display='none';y.style.transform='scale(1.5)';$('qh').textContent=QH[5];return}
 b.textContent=LB[tries];b.style.transform='translate('+(Math.random()*140-70)+'px,'+(Math.random()*70-35)+'px) scale('+(1-tries*.14)+')';y.style.transform='scale('+(1+tries*.14)+')';$('qh').textContent=QH[tries]}
$('no').addEventListener('touchstart',dodge,{passive:false});$('no').addEventListener('click',dodge);
$('yes').onclick=function(){$('q').classList.add('hidden');$('thx').classList.remove('hidden');petals(60)};
</script></body></html>
